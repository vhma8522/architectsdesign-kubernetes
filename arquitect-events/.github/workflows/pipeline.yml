name: Proyecto IA - Pipeline de Integración

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Validación de Estructura (Paso B)
        run: python -m py_compile json_receiver.py

      - name: 5. Ejecutar Pruebas de Humo (Paso C)
        run: python -m pytest tests/test_smoke.py -v --cov=.