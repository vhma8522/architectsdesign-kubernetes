name: Python CI Pipeline

# El flujo se dispara en cada push a la rama principal
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar código
      uses: actions/checkout@v3

    - name: 2. Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 3. Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar Pruebas Unitarias y Cobertura
      run: |
        # Ejecutamos pytest y generamos reporte de cobertura
        python -m pytest --cov=. --cov-report=term-missing tests/

    - name: 5. Validar Umbral de Calidad
      run: |
        # Ejemplo: El pipeline falla si la cobertura es menor al 80%
        python -m pytest --cov=. --cov-fail-under=80 tests/