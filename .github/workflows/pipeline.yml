name: CI/CD Pipeline - Proyecto IA

# Disparadores: Se activa al subir cambios a main o master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    # CONFIGURACIÓN DE SUBPROYECTO:
    # Cambia 'nombre_de_tu_subcarpeta' por el nombre real de tu carpeta
    defaults:
      run:
        working-directory: ./arquitect-events

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Instalamos los necesarios para CI si no están en requirements
          pip install pytest pytest-cov stomp.py jsonschema

      - name: 4. Validación de Estructura (Paso B)
        run: python -m py_compile json_receiver.py

      - name: 5. Ejecutar Pruebas de Humo (Paso C)
        run: |
          # Ejecuta los tests y falla si la cobertura es menor al 80%
          python -m pytest tests/test_smoke.py -v --cov=. --cov-fail-under=80